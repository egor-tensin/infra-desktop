name: Maintenance

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ansible hosts'
        type: string
        default: all
        required: false

permissions: {}

jobs:
  maintenance:
    name: Maintenance
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # FIXME: add setup-wireguard back once the hosted runner nonsense is gone.
      - name: Set up ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Run maintenance
        env:
          LIMIT: ${{ inputs.limit }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          make maintenance
