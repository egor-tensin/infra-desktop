[defaults]
inventory = inventory
callback_result_format = yaml
display_skipped_hosts = false
interpreter_python = auto_silent

[ssh_connection]
retries = 2
ssh_extra_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ForwardAgent=yes -o StrictHostKeyChecking=no
# The stupid "Module invocation had junk after JSON data" warnings:
# https://github.com/ansible/ansible/issues/86122#issuecomment-3516196729
ssh_common_args = -o "SetEnv TERM=dumb"
