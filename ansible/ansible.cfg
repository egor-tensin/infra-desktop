[defaults]
inventory = inventory
vault_password_file = scripts/vault_pass.sh

# Prettier output.
callback_result_format = yaml

# Shut up already.
display_skipped_hosts = false
interpreter_python = auto_silent
host_key_checking = true

# This setting is experimental; the docs warn that it might clash with sudo.
pipelining = true

[ssh_connection]
retries = 2
# FIXME: remove the StrictHostKeyChecking parameter once the self-hosted runner
# is gone or is updated (in favour of the supposedly more modern host_key_checking).
ssh_extra_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ForwardAgent=yes -o StrictHostKeyChecking=no
# The stupid "Module invocation had junk after JSON data" warnings:
# https://github.com/ansible/ansible/issues/86122#issuecomment-3516196729
ssh_common_args = -o "SetEnv TERM=dumb"
