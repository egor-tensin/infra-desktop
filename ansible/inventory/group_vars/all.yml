my_name: Egor Tensin
my_email: egor@tensin.name

sudo_env:
  - HOME
  - EDITOR
  - SSH_AUTH_SOCK

kernel_flavour: lts
kernel_bootloader: systemd-boot
journald_log_level: info
desktop_environment_impl: labwc
display_manager_impl: ly
display_manager_autologin: true

my_workspace_git_name: '{{ my_name }}'
my_workspace_git_email: '{{ my_email }}'

wireguard_backend: NetworkManager
wireguard_prefix4: '192.168.205'
wireguard_prefix6: 'fd9d:bc11:4021::192.168.205'
