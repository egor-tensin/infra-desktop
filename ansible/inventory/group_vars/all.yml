my_name: Egor Tensin
my_email: egor@tensin.name

etckeeper_git_name: '{{ my_name }}'
etckeeper_git_email: '{{ my_email }}'

etckeeper_ignored_paths:
  # My resolv.conf is typically managed, by either systemd or NetworkManager.
  - /resolv.conf
  # This is just a stupid systemd file.
  - /.updated
  # I really don't need all the Wi-Fi networks.
  - /NetworkManager/system-connections/
  # I'm unsure about this; but it does make pacman upgrades much easier - I
  # don't need to account for /etc/pacman.d/gnupg suddenly having changes.
  - /pacman.d/gnupg/
  # I frequently run something to rate my mirrors.
  - /pacman.d/mirrorlist

kernel_flavour: lts

my_workspace_git_name: '{{ my_name }}'
my_workspace_git_email: '{{ my_email }}'

wg_backend: NetworkManager
wg_prefix4: '192.168.205'
wg_prefix6: 'fd9d:bc11:4021::192.168.205'

aur_packages_basic:
  - lightdm-settings
  - yandex-cloud-cli-bin
  - yay

aur_packages_desktop:
  - slack-desktop
  - spotify
  - zoom
