# It's a "server", so running always:
docker_enable_service: true
power_management_suspend_on_external: false

my_workspace_projects:
  - url: 'ssh://git@altssh.bitbucket.org:443/egor-tensin/server-tensin-laptop2.git'
    name: server

wireguard_private_key: '{{ laptop2.wg.private_key }}'
wireguard_addr4: '{{ wireguard_prefix4 }}.2/24'
wireguard_addr6: '{{ wireguard_prefix6 }}.2/48'
wireguard_peers_ger:
  - public_key: hMKs36wq+gnp6fVIIgGRVL42q78+Rnj/3RCEWGA69Bs=
    preshared_key: '{{ laptop2.wg.psk.vpn }}'
    endpoint: vpn.tensin.name:443
    allowed_ips: '{{ wireguard_allowed_ips }}'
    persistent_keepalive: 25
wireguard_peers_rus:
  - public_key: XW2gwuu1pVYe4cXuk32jsgvqstx7Yd0/hj3hefRzaXQ=
    preshared_key: '{{ laptop2.wg.psk.vpn_ru }}'
    endpoint: vpn-ru.tensin.name:443
    allowed_ips: '{{ wireguard_allowed_ips }}'
    persistent_keepalive: 25
