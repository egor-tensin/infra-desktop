- name: Maintenance
  hosts: all
  gather_facts: false
  vars_files:
    - vars/vault.yml
  roles:
    - tensin.infra.arch_linux
    - tensin.infra.my_dotfiles
    - power_management
    - networking
    - apps_utils
    - apps_development
    - desktop_environment
    - display_manager
    - apps_desktop

- name: laptop2
  hosts: laptop2
  gather_facts: false
  roles:
    - tensin.infra.linux_status
    - dump

- name: Set up workflows
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_workspace
