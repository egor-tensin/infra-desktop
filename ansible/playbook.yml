- name: Basic configuration
  hosts: all
  gather_facts: false

  vars_files:
    - vars/packages.yml

  roles:
    - tensin.infra.pacman
    - tensin.infra.etckeeper

    - kernel
    - microcode

    - reflector
    - paccache

    - name: tensin.infra.pacman_install
      vars:
        pacman_packages: '{{ packages_basic }}'

    - sudo
    - sshd
    - docker

    - lightdm_autologin

    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn
        wg_autoconnect: true
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_ger
        wg_tunnel_everything: true
        wg_autoconnect: false
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_rus
        wg_tunnel_everything: true
        wg_autoconnect: false
        wg_peers: '{{ wg_peers_ru }}'

- name: Time synchronization on laptops
  hosts: laptops
  gather_facts: false
  roles:
    - chrony

- name: Time synchronization on PCs
  hosts: pcs
  gather_facts: false
  roles:
    - systemd_timesyncd

- name: Set up the file dump
  hosts: laptop2
  gather_facts: false
  roles:
    - dump

- name: Set up workflows
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_dotfiles
    - tensin.infra.my_workspace
    - cloudlinux

- name: Upgrade AUR packages
  hosts: all
  gather_facts: false
  tasks:
    - kewlfft.aur.aur:
        name: '{{ aur_packages }}'
        state: latest
        use: yay
        aur_only: true
