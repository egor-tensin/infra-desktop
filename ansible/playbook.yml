- name: Maintenance
  hosts: all
  gather_facts: false

  roles:
    - tensin.infra.locale
    - makepkg
    - tensin.infra.pacman
    - tensin.infra.reflector
    - tensin.infra.paccache
    - tensin.infra.yay

    - microcode
    #- kernel

    - tensin.infra.sudo
    - tensin.infra.journald
    - tensin.infra.sshd
    - wireguard

    - utils
    - development

    - tensin.infra.cups

    - tensin.infra.my_dotfiles

- name: Set up the file dump
  hosts: laptop2
  gather_facts: false
  roles:
    - dump

- name: Set up workflows
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_workspace
