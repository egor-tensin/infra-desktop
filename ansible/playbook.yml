- name: Maintenance
  hosts: all
  gather_facts: false

  roles:
    - tensin.infra.locale
    - makepkg
    - tensin.infra.pacman
    - tensin.infra.reflector
    - tensin.infra.paccache

    - kernel
    - microcode

    - tensin.infra.sudo
    - tensin.infra.journald
    - tensin.infra.sshd
    - wireguard

    - apps_utils
    - apps_development
    - tensin.infra.my_dotfiles
    - desktop_environment
    - desktop_manager
    - apps_desktop

- name: laptop2
  hosts: laptop2
  gather_facts: false
  roles:
    - tensin.infra.linux_status
    - dump

- name: Set up workflows
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_workspace
