- name: Maintenance
  hosts: all
  gather_facts: false

  vars_files:
    - vars/packages.yml

  roles:
    - makepkg
    - tensin.infra.pacman
    - tensin.infra.reflector
    - tensin.infra.paccache
    - aur
    - name: tensin.infra.pacman_install
      vars:
        pacman_packages: '{{ packages }}'

    - kernel
    - microcode

    - tensin.infra.sshd
    - name: tensin.infra.journald
      vars:
        journald_log_level: info
    - sudo
    - ntp

    - tensin.infra.docker
    - libvirt

    - lightdm_autologin
    - cups
    - mime

    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn
        wg_autoconnect: true
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_ger
        wg_tunnel_everything: true
        wg_autoconnect: false
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_rus
        wg_tunnel_everything: true
        wg_autoconnect: false
        wg_peers: '{{ wg_peers_ru }}'

    - cloudlinux

- name: Set up the file dump
  hosts: laptop2
  gather_facts: false
  roles:
    - dump

- name: Set up workflows
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_dotfiles
    - tensin.infra.my_workspace
