- name: Basic configuration
  hosts: all
  gather_facts: false

  vars_files:
    - vars/packages.yml

  roles:
    - tensin.infra.pacman
    - tensin.infra.etckeeper
    - kernel
    - microcode
    - reflector
    - paccache
    - makepkg
    - name: tensin.infra.pacman_install
      vars:
        pacman_packages: '{{ packages_basic }}'
    - ntp
    - sudo
    - sshd
    - docker
    - lightdm_autologin

    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn
        wg_autoconnect: true
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_ger
        wg_tunnel_everything: true
        wg_autoconnect: false
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_rus
        wg_tunnel_everything: true
        wg_autoconnect: false
        wg_peers: '{{ wg_peers_ru }}'

- name: Set up the file dump
  hosts: laptop2
  gather_facts: false
  roles:
    - dump

- name: Set up workflows
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_dotfiles
    - tensin.infra.my_workspace
    - cloudlinux

- name: Upgrade AUR packages
  hosts: all
  gather_facts: false
  tasks:
    - name: Run yay
      kewlfft.aur.aur:
        name: '{{ aur_packages }}'
        state: latest
        use: yay
        aur_only: true
        extra_args: --cleanafter
      # AUR connection fail a bit too frequently:
      retries: 3
      delay: 3

    - name: etckeeper commit
      become: true
      tensin.infra.etckeeper_commit:
        msg: enable linux-status
        allowlist:
          - systemd/system/multi-user.target.wants/linux-status.service
        skip_no_changes: true
