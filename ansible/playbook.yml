- name: Basic configuration
  hosts: all
  gather_facts: false

  vars_files:
    - vars/packages.yml

  roles:
    - tensin.infra.pacman
    - microcode
    - tensin.infra.etckeeper
    - lts_kernel

    - name: tensin.infra.reflector
    - name: tensin.infra.etckeeper_commit
      vars:
        etckeeper_commit_allowlist:
          - systemd/system/multi-user.target.wants/reflector.service
          - systemd/system/timers.target.wants/reflector.timer
        etckeeper_commit_msg: 'configure reflector'

    - name: tensin.infra.pacman_install
      vars:
        pacman_packages: '{{ packages_basic }}'

    - tensin.infra.paccache
    - name: tensin.infra.etckeeper_commit
      vars:
        etckeeper_commit_allowlist:
          - systemd/system/multi-user.target.wants/paccache.service
          - systemd/system/timers.target.wants/paccache.timer
        etckeeper_commit_msg: 'configure paccache'

    - sudo
    - name: tensin.infra.etckeeper_commit
      vars:
        etckeeper_commit_allowlist: ['sudoers.d/{{ ansible_user }}']
        etckeeper_commit_msg: 'sudo: configure user {{ ansible_user }}'

    - tensin.infra.sshd
    - name: tensin.infra.etckeeper_commit
      vars:
        etckeeper_commit_allowlist:
          - ssh/sshd_config
          - systemd/system/multi-user.target.wants/sshd.service
        etckeeper_commit_msg: 'sshd: configure'

    - tensin.infra.wireguard
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_ger
        wg_tunnel_everything: true
        wg_autoconnect: false
    - name: tensin.infra.wireguard
      vars:
        wg_name: vpn_rus
        wg_tunnel_everything: true
        wg_autoconnect: false
        wg_peers: '{{ wg_peers_ru }}'

    - tensin.infra.docker
    - name: tensin.infra.etckeeper_commit
      vars:
        etckeeper_commit_allowlist:
          - systemd/system/sockets.target.wants/docker.socket
          - systemd/system/multi-user.target.wants/docker.service
        etckeeper_commit_msg: 'systemd: configure Docker'

    - lightdm_autologin

- name: Time synchronization on laptops
  hosts: laptops
  gather_facts: false
  roles:
    - chrony
    - name: tensin.infra.etckeeper_commit
      vars:
        etckeeper_commit_allowlist:
          - systemd/system/multi-user.target.wants/chronyd.service
          - systemd/system/multi-user.target.wants/systemd-timesyncd.service
        etckeeper_commit_msg: 'systemd: configure chrony'

- name: Time synchronization on PCs
  hosts: pcs
  gather_facts: false
  roles:
    - systemd_timesyncd
    - name: tensin.infra.etckeeper_commit
      vars:
        etckeeper_commit_allowlist:
          - systemd/system/multi-user.target.wants/systemd-timesyncd.service
        etckeeper_commit_msg: 'systemd: configure systemd-timesyncd'

- name: Set up the file dump
  hosts: laptop2
  gather_facts: false
  roles:
    - dump

- name: Set up workflows
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_dotfiles
    - tensin.infra.my_workspace
    - cloudlinux
