- name: Install Ristretto
  become: true
  ansible.builtin.package:
    name: ristretto
    state: present

- name: Configure MIME associations
  ansible.builtin.import_role:
    name: tensin.infra.mime
  vars:
    mime_apps:
      # Really tired of browsers for some reason taking over my images.
      - org.xfce.ristretto
