dependencies:
  - role: tensin.infra.pacman_install
    vars:
      pacman_install_packages: '{{ apps_development_packages }}'
  - role: tensin.infra.aur_install
    vars:
      aur_install_packages: '{{ apps_development_aur }}'
  - role: tensin.infra.docker
    vars:
      docker_add_to_group: true
