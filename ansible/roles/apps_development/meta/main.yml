dependencies:
  - role: tensin.infra.install
    vars:
      install_packages: '{{ apps_development_packages }}'
  - role: tensin.infra.install
    vars:
      install_packages: '{{ apps_development_aur }}'
      install_backend: yay
  - role: tensin.infra.docker
    vars:
      docker_add_to_group: true
      docker_logging_driver: local
