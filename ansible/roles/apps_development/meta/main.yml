dependencies:
  - role: tensin.infra.pacman_install
    vars:
      pacman_install_packages: |
        {{
           development_core
           + development_extra
           + development_python
        }}
  - role: tensin.infra.aur_install
    vars:
      aur_install_packages: |
        {{ development_aur }}
  - role: tensin.infra.docker
    vars:
      docker_add_to_group: true
