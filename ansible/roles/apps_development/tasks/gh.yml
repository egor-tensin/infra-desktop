# More info can be found here: https://cli.github.com/manual/gh_auth_login

- name: Check GitHub CLI auth
  ansible.builtin.command: gh auth status --hostname github.com
  changed_when: false
  failed_when: false
  register: gh_auth_status

- name: Configure GitHub CLI auth
  when: gh_auth_status.rc != 0
  no_log: true
  ansible.builtin.command:
    argv:
      - gh
      - auth
      - login
      - --hostname
      - github.com
      - --git-protocol
      - ssh
      - --skip-ssh-key
      - --with-token
    stdin: '{{ github.token }}'
