- name: Pull dotfiles
  tensin.infra.safe_git:
    repo: ssh://git@bitbucket.org/egor-tensin/cl-home.git
    dest: ~/workspace/cl/home
    version: master
    accept_hostkey: true
  register: dotfiles

- name: Run config-links
  ansible.builtin.include_role:
    name: tensin.infra.config_links
  vars:
    config_links_action: update
    config_links_path: ~/workspace/cl/home
  when: dotfiles.changed
