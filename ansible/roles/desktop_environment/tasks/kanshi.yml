- name: Install kanshi
  become: true
  ansible.builtin.package:
    name: kanshi
    state: present

- name: Create ~/.config/kanshi
  ansible.builtin.file:
    path: ~/.config/kanshi
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'

- name: Create ~/.config/kanshi/config
  ansible.builtin.template:
    src: kanshi/config.j2
    dest: ~/.config/kanshi/config
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
  notify: reboot
