- name: Install kanshi
  become: true
  ansible.builtin.package:
    name: kanshi
    state: present

- name: Configure kanshi
  tensin.infra.template:
    src: kanshi/config.j2
    dest: ~/.config/kanshi/config
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
  notify: reboot
