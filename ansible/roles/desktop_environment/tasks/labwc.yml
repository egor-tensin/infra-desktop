- name: Install labwc & utilities
  become: true
  ansible.builtin.package:
    name:
      - labwc
      # Desktop background
      - swaybg
      # Screen power
      - brightnessctl
      - swayidle
      - swaylock
      - wlopm
      # Screen capture
      - grim
      - slurp
      # Shit I don't know enough about
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
    state: present
  notify: reboot

- name: Configure apps
  loop:
    - alacritty
    - kanshi
    - mako
    - themes
    # As of Oct '26, all other Wayland-native options worked like crap when I
    # tried them.
    - xfce4-panel
  loop_control:
    loop_var: labwc_app
  ansible.builtin.include_tasks: '{{ labwc_app }}.yml'

- name: Create ~/.config/labwc
  ansible.builtin.file:
    path: ~/.config/labwc
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'

- name: Clone labwc-artwork
  ansible.builtin.git:
    repo: 'https://github.com/labwc/labwc-artwork.git'
    dest: ~/.config/labwc/labwc-artwork
    version: HEAD
    accept_hostkey: true

- name: Create symlink to labwc-artwork
  ansible.builtin.file:
    src: .config/labwc/labwc-artwork/themes
    dest: ~/.themes
    state: link
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'

- name: Configure labwc
  loop:
    - autostart
    - environment
    - rc.xml
    - shutdown
  ansible.builtin.template:
    src: 'labwc/{{ item }}.j2'
    dest: '~/.config/labwc/{{ item }}'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
  notify: reboot
