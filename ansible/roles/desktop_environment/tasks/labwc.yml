- name: Install labwc & utilities
  become: true
  ansible.builtin.package:
    name:
      # The configs for all of these are in linux-home.
      - labwc
      # Terminal emulator
      - alacritty
      # Display configuration
      - kanshi
      # Desktop background
      - swaybg
      # Screen power
      - brightnessctl
      - swayidle
      - swaylock
      # Screenshots
      - grim
      - slurp
      # Notifications
      - mako
      # Shit I don't know about
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
    state: present
