- name: Install labwc & utilities
  become: true
  ansible.builtin.package:
    name:
      - labwc
      # Desktop background
      - swaybg
      # Screen power
      - brightnessctl
      - swayidle
      - swaylock
      - wlopm
      # Screen capture
      - grim
      - slurp
      # Utilities
      - wl-clipboard
      # Shit I don't know enough about
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
    state: present
  notify: reboot

- name: Configure apps
  loop:
    - alacritty
    - kanshi
    - mako
    - themes
    - udiskie
    # As of Oct '26, all other Wayland-native options worked like crap when I
    # tried them.
    - xfce4-panel
  loop_control:
    loop_var: labwc_app
  ansible.builtin.include_tasks: '{{ labwc_app }}.yml'

- name: Configure labwc
  loop:
    - autostart
    - environment
    - rc.xml
    - shutdown
  tensin.infra.template:
    src: 'labwc/{{ item }}.j2'
    dest: '~/.config/labwc/{{ item }}'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
  notify: reboot

- name: Clone labwc-themes
  ansible.builtin.git:
    repo: 'https://github.com/labwc/labwc-themes.git'
    dest: ~/.local/share/themes
    version: HEAD
    accept_hostkey: true
  notify: reboot
