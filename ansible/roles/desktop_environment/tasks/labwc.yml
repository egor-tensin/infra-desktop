- name: Install labwc & utilities
  become: true
  ansible.builtin.package:
    name:
      # The configs for all of these are in linux-home.
      - labwc
      # Terminal emulator
      - alacritty
      # Display configuration
      - kanshi
      # Desktop background
      - swaybg
      # Notifications
      - mako

      - brightnessctl
    state: present
