- name: Install labwc & utilities
  become: true
  ansible.builtin.package:
    name:
      - labwc
      # Terminal emulator
      - alacritty
      # Display configuration
      - kanshi
      # Desktop background
      - swaybg
      # Screen power
      - brightnessctl
      - swayidle
      - swaylock
      - wlopm
      # Screen capture
      - grim
      - slurp
      # Notifications
      - mako
      # Shit I don't know about
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
    state: present

- name: Create ~/.config/labwc
  ansible.builtin.file:
    path: ~/.config/labwc
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'

- name: Configure labwc
  loop:
    - environment
    - autostart
  ansible.builtin.template:
    src: 'labwc/{{ item }}.j2'
    dest: '~/.config/labwc/{{ item }}'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'

- name: Configure alacritty
  ansible.builtin.import_tasks: alacritty.yml

- name: Configure kanshi
  ansible.builtin.import_tasks: kanshi.yml

- name: Configure mako
  ansible.builtin.import_tasks: mako.yml
