- name: Install mako
  become: true
  ansible.builtin.package:
    name: mako
    state: present

- name: Configure mako
  tensin.infra.template:
    src: mako/config.j2
    dest: ~/.config/mako/config
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
  notify: reboot
