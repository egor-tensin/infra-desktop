- name: Install udiskie
  become: true
  ansible.builtin.package:
    name: udiskie
    state: present

- name: Configure udiskie
  loop:
    - src: udiskie/mount_options.conf.j2
      dest: /etc/udisks2/mount_options.conf
    - src: udiskie/tmpfiles_media.conf.j2
      dest: /etc/tmpfiles.d/media.conf
    - src: udiskie/udisks2.rules.j2
      dest: /etc/udev/rules.d/udisks2.rules
  become: true
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  notify: reboot
