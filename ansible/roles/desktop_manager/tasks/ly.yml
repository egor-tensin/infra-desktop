- name: Install ly
  become: true
  ansible.builtin.package:
    name: ly
    state: present
  notify: ly_setup

- name: Enable ly service
  become: true
  ansible.builtin.systemd_service:
    name: ly@tty1
    enabled: true
  notify: ly_setup

- name: Disable getty service
  become: true
  ansible.builtin.systemd_service:
    name: getty@tty1
    enabled: false
  notify: ly_setup
