- name: Install ly
  become: true
  ansible.builtin.package:
    name: ly
    state: present

- name: Configure ly
  loop:
    - option: clock
      value: '%F %T'
    - option: default_input
      value: password
  become: true
  community.general.ini_file:
    path: /etc/ly/config.ini
    option: '{{ item.option }}'
    value: '{{ item.value }}'
    state: present
    create: false
    owner: root
    group: root
    mode: '0644'
  notify: display_manager_configured

- name: Configure automatic login
  when: display_manager_autologin
  loop:
    - option: auto_login_user
      value: '{{ ansible_user }}'
    - option: auto_login_session
      value: '{{ desktop_environment_impl }}'
  become: true
  community.general.ini_file:
    path: /etc/ly/config.ini
    option: '{{ item.option }}'
    value: '{{ item.value }}'
    state: present
    create: false
    owner: root
    group: root
    mode: '0644'
  notify: display_manager_configured

- name: Enable ly service
  become: true
  ansible.builtin.systemd_service:
    name: ly@tty1
    enabled: true
  notify: display_manager_configured

- name: Disable getty service
  become: true
  ansible.builtin.systemd_service:
    name: getty@tty1
    enabled: false
  notify: display_manager_configured
