- name: etckeeper commit
  become: true
  tensin.infra.etckeeper_commit:
    msg: 'fstab: configure the file dump'
    allowlist:
      - fstab
      - systemd/system/docker.service.d/
      - systemd/system/docker.service.d/depend_mount__mnt_dump.conf
    skip_no_changes: true
  listen: dump_configured

- name: Reload systemd daemon
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: systemd_reload
