- name: Get distro
  ansible.builtin.setup:
    gather_subset:
      - distribution

- name: Fail unless Arch Linux
  ansible.builtin.fail:
    msg: Only works on Arch Linux
  when: |
    ansible_facts['distribution'] != 'Archlinux'

- name: Fail if wrong flavour
  ansible.builtin.fail:
    msg: Kernel flavour must be either 'latest' or 'lts'
  when: |
    kernel_flavour not in ['latest', 'lts']

- name: Fail if invalid bootloader
  ansible.builtin.fail:
    msg: |
      Support bootloaders are: 'grub', 'systemd-boot'
  when: |
    kernel_bootloader not in ['grub', 'systemd-boot']

- vars:
    packages: |
      {{
        {
          'latest': ['linux', 'linux-headers'],
          'lts': ['linux-lts', 'linux-lts-headers'],
        }[kernel_flavour]
      }}
    kernel_image: |
      {{
        {
          'latest': '/boot/vmlinuz-linux',
          'lts': '/boot/vmlinuz-linux-lts',
        }[kernel_flavour]
      }}
  block:
    - name: Install packages
      become: true
      ansible.builtin.package:
        name: '{{ packages }}'
        state: present

    - name: 'Set up for bootloader {{ kernel_bootloader }}'
      ansible.builtin.include_tasks: '{{ kernel_bootloader }}.yml'
