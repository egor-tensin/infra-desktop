- name: Install libvirt & dependencies
  become: true
  ansible.builtin.package:
    name:
      - libvirt
      - qemu-desktop
      - dnsmasq
    state: present

- name: Add user to group libvirt
  become: true
  ansible.builtin.user:
    append: true
    groups: [libvirt]
    name: '{{ ansible_user }}'

- name: Enable & start libvirt
  become: true
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started

- name: Fix networking for libvirt
  become: true
  # https://superuser.com/a/1857648
  # https://bbs.archlinux.org/viewtopic.php?id=284664
  community.general.ini_file:
    path: /etc/libvirt/network.conf
    option: firewall_backend
    value: '"iptables"'
    owner: root
    group: root
    mode: '0644'
  notify:
    - libvirt_restart

- name: Run handlers if neccessary
  ansible.builtin.meta: flush_handlers
