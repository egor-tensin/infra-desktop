- name: Override makepkg OPTIONS
  become: true
  ansible.builtin.template:
    src: debug.conf.j2
    dest: /etc/makepkg.conf.d/debug.conf
    owner: root
    group: root
    mode: '644'
  register: debug_conf

- name: etckeeper commit
  become: true
  tensin.infra.etckeeper_commit:
    msg: |
      makepkg: disable debug packages
    allowlist:
      - makepkg.conf.d/debug.conf
  when: debug_conf.changed
