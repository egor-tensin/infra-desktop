- name: etckeeper commit
  become: true
  tensin.infra.etckeeper_commit:
    msg: 'systemd: configure chrony'
    allowlist:
      - systemd/system/multi-user.target.wants/chronyd.service
      - systemd/system/multi-user.target.wants/systemd-timesyncd.service
  listen: etckeeper_chrony

- name: etckeeper commit
  become: true
  tensin.infra.etckeeper_commit:
    msg: 'systemd: configure systemd-timesyncd'
    allowlist:
      - systemd/system/multi-user.target.wants/systemd-timesyncd.service
  listen: etckeeper_systemd_timesyncd
