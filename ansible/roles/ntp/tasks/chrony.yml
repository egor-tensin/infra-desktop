- name: Install chrony
  become: true
  ansible.builtin.package:
    name: chrony
    state: present

- name: Disable systemd-timesyncd
  become: true
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: false
    state: stopped

- name: Enable & start chrony
  become: true
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started
