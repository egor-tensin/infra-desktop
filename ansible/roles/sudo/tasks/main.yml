- name: Configure sudo
  become: true
  ansible.builtin.template:
    src: sudoers.j2
    dest: '/etc/sudoers.d/{{ ansible_user }}'
    owner: root
    group: root
    mode: '440'
    validate: 'visudo -cf %s'
  register: sudoers_file

- name: etckeeper commit
  when: sudoers_file.changed
  become: true
  tensin.infra.etckeeper_commit:
    msg: 'sudo: configure user {{ ansible_user }}'
    allowlist: ['sudoers.d/{{ ansible_user }}']
