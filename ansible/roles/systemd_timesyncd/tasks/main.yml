- name: Enable & start systemd-timesyncd
  become: true
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  register: systemd

- name: etckeeper commit
  when: systemd.changed
  become: true
  tensin.infra.etckeeper_commit:
    msg: 'systemd: configure systemd-timesyncd'
    allowlist:
      - systemd/system/multi-user.target.wants/systemd-timesyncd.service
