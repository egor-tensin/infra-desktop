dependencies:
  - role: tensin.infra.wireguard
    vars:
      wg_name: vpn
      wg_autoconnect: true
  - role: tensin.infra.wireguard
    vars:
      wg_name: vpn_ger
      wg_tunnel_everything: true
      wg_autoconnect: false
  - role: tensin.infra.wireguard
    vars:
      wg_name: vpn_rus
      wg_tunnel_everything: true
      wg_autoconnect: false
      wg_peers: '{{ wg_peers_ru }}'
